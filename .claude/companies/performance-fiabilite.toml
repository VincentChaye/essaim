name = "performance-fiabilite"
max_calls = 50
max_parallel = 3
checkpoint = true

[[seat]]
id = "ceo"
title = "CEO"
agent = "perf-director"
expertise = "pilotage performance et fiabilité, arbitrage des priorités"

[[seat]]
id = "cto"
title = "CTO"
agent = "perf-architect"
reports_to = "ceo"
expertise = "architecture performante, optimisation algorithmique, anti-redondance du code"

[[seat]]
id = "head-perf"
title = "Head of Performance Engineering"
agent = "engineering-manager"
reports_to = "cto"
expertise = "profilage, complexité algorithmique, allocations, concurrence, optimisations ciblées"

[[seat]]
id = "perf-analyst"
title = "Performance Engineer"
agent = "perf-analyst"
reports_to = "head-perf"
expertise = "chemins critiques, complexité Big-O, clones et allocations inutiles, entrées/sorties"

[[seat]]
id = "dev-perf"
title = "Backend Engineer (Optimisation)"
agent = "developer"
reports_to = "head-perf"
expertise = "mise en oeuvre des optimisations, benchmarks, non-régression"
builds = true
helpers = "haiku"
allow_bash = [
    "cargo build",
    "cargo test",
    "cargo bench",
    "cargo clippy",
    "git status",
    "git diff",
    "git log",
    "git show",
    "git add",
    "git commit",
    "wc",
    "grep",
    "diff",
]

